[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flaxy"
version = "0.1.0"
description = "Permutation-invariant capture PES with physical long-range tails"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
plots = ["matplotlib"]

[tool.setuptools]
packages = ["flaxy"]
package-dir = {flaxy = "src"}

[tool.pytest.ini_options]
pythonpath = [".", "tests"]
testpaths = ["tests"]
